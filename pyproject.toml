[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zabbix-vulnscan"
version = "0.1.0"
description = "Zabbix vulnerability scanner (2016-2026): fingerprint, passive condition scan, active exploit modules"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["zabbix", "security", "scanner", "cve", "exploit", "pentest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = ["requests>=2.31"]

[project.scripts]
zbxscan = "zbxscan.cli:main"

[project.urls]
"Source" = "https://github.com/<you>/zabbix-vulnscan"

[tool.setuptools.packages.find]
include = ["zbxscan*"]